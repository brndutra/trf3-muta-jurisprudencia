<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prontuário e Gerador · Minutário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16283a;--ink2:#43566b;--mut:#6b7d90;--mut2:#93a3b3;--line:#e6ebef;--line2:#eef2f5;
  --bg:#eef1f4;--panel:#f5f7f9;--chip:#f2f5f7;--w:#fff;--navy:#1f3d63;--teal:#123440;
  --ok:#22744f;--okbg:#e6f3ec;--warn:#8b5a12;--warnbg:#fdf3dc;--bad:#b23a3a;--badbg:#fbe7e7;--orange:#e08a3a;
  --blue:#2a6fb8;--gold:#9a6b00;--lil:#6b4fa0;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 12.5px/1.35 Figtree,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #5b8fd6;outline-offset:1px}
.wrap{max-width:1460px;margin:0 auto;padding:18px 16px 60px}
select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#c2ccd5 50%),linear-gradient(135deg,#c2ccd5 50%,transparent 50%);background-position:calc(100% - 11px) 50%,calc(100% - 7px) 50%;background-size:4px 4px;background-repeat:no-repeat}

/* topo */
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.top h1{margin:0;font:800 16px Figtree,system-ui,sans-serif}
.top .sub{color:var(--mut);font-weight:600}
.top .sp{flex:1}
.tbtn{height:30px;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:7px;background:var(--w);color:var(--ink2);font-weight:700;padding:0 11px;box-shadow:0 0 0 1px var(--line)}
.tbtn:hover{color:var(--ink);box-shadow:0 0 0 1px #d5dde3}
.tbtn.pri{background:var(--teal);color:#fff;box-shadow:none}
.tbtn svg{width:14px;height:14px}
.filters{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 10px}
.fchip{height:26px;border:0;border-radius:13px;padding:0 11px;background:var(--w);color:var(--mut);font:700 11.5px Figtree,system-ui,sans-serif;box-shadow:0 0 0 1px var(--line)}
.fchip[aria-pressed=true]{background:var(--fc,var(--navy));color:#fff;box-shadow:none}
.fchip b{font-weight:800;opacity:.7;margin-left:4px}
.fdot{width:8px;height:8px;border-radius:50%;background:var(--fc);display:inline-block;margin-right:6px}
.fchip[aria-pressed=true] .fdot{background:#fff}

/* linha do processo */
.list{display:flex;flex-direction:column;gap:6px}
.proc{background:var(--w);border-radius:12px;box-shadow:0 0 0 1px #e1e8ee}
.proc.open{box-shadow:0 0 0 1px #d5dde3,0 6px 18px rgba(22,40,58,.06)}
.row{display:grid;grid-template-columns:72px 230px minmax(0,1fr) 178px 340px;align-items:center;column-gap:8px;padding:6px 12px;min-height:48px}
.proc.open .row{border-bottom:1px solid var(--line2)}
.c0{display:flex;align-items:center;gap:6px}
.chev{width:20px;height:22px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:var(--chip);color:var(--teal);padding:0}
.chev svg{transition:transform .15s}
.proc.open .chev svg{transform:rotate(180deg)}
.c0 input{width:16px;height:16px;margin:0}
.item{min-width:26px;height:26px;padding:0 6px;border:0;border-radius:7px;font:800 13px Figtree,system-ui,sans-serif}
.cx1{background:var(--okbg);color:var(--ok)}.cx2{background:var(--warnbg);color:var(--warn)}.cx3{background:var(--badbg);color:var(--bad)}
.c1,.c2{display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0;line-height:1.2}
.c1{padding-left:10px}
.num{font:600 12.5px ui-monospace,Menlo,monospace;white-space:nowrap}
.partes{font:600 11px Figtree,system-ui,sans-serif;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sep{border-left:1px solid var(--line2);padding-left:10px}
.ass{font:700 12.5px Figtree,system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tags{display:flex;align-items:center;gap:4px;min-width:0;flex-wrap:wrap}
.tag{height:16px;display:inline-flex;align-items:center;padding:0 6px;border-radius:4px;font:700 9.5px Figtree,system-ui,sans-serif;white-space:nowrap;border:0}
.meta{min-width:14px;height:16px;border:0;background:transparent;color:#c3ced8;padding:5px 1px 0;font:700 15px/1 Figtree,system-ui,sans-serif}
.meta:hover{color:#c27a12}
.c3{display:flex;align-items:center;gap:2px}
.ib{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;color:var(--mut);border-radius:6px;padding:0;position:relative;flex:none}
.ib:hover{background:var(--chip);color:var(--ink)}
.ib svg{width:14px;height:14px}
.ib.on{color:var(--blue)}
.badge{position:absolute;top:0;right:-1px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:var(--orange);color:#fff;font:800 9px Figtree,system-ui,sans-serif;display:inline-flex;align-items:center;justify-content:center}
.badge.red{background:#d0473a}.badge.blue{background:var(--blue)}
.c4{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.who{display:flex;gap:4px;min-width:0}
.sel{height:26px;border:0;border-radius:6px;background-color:var(--chip);padding:0 20px 0 8px;font:700 12px Figtree,system-ui,sans-serif;color:var(--ink);min-width:0}
.sel.srv{max-width:96px}.sel.cor{width:58px;color:var(--ink2)}
.trail{display:flex;align-items:center;gap:4px}
.trail i{width:8px;height:1px;background:#d5e0e5;display:inline-block}
.st{width:24px;height:24px;border-radius:50%;border:0;padding:0;background:var(--chip);color:var(--mut);display:inline-flex;align-items:center;justify-content:center;flex:none}
.st svg{width:12px;height:12px}
.st.min.on{background:var(--okbg);color:var(--ok)}
.st.cor.on{background:#e3eefa;color:var(--blue)}
.st.lib.on{background:#efe9f8;color:var(--lil)}
.st.tog{width:20px;height:20px;border:1.5px dashed #c5d0d9;background:#fff;color:var(--mut2)}
.st.tog svg{width:11px;height:11px}
.st.tog.on{border:0;background:#fdf0dd;color:#b26a12}
.st:disabled{opacity:.45;cursor:not-allowed}

/* corpo: barra + 4 colunas (K148) */
.body{display:grid;grid-template-columns:44px repeat(4,minmax(0,1fr));gap:8px;padding:6px 12px 12px;align-items:stretch}
.bar{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;background:var(--panel);border-radius:10px}
.bar .ib{width:30px;height:30px;background:#fff;box-shadow:0 0 0 1px var(--line);color:var(--ink2)}
.bar .ib:hover{color:var(--ink)}
.bar .ib.dark{background:var(--teal);color:#fff;box-shadow:none}
.bar .grow{flex:1}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.ph{font:700 9.5px Figtree,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mut2);padding:0 4px}
.tc{background:var(--panel);border-radius:10px;padding:0 10px 6px;display:flex;flex-direction:column;min-width:0}
.tc.grow{flex:1}
.tc-h{display:flex;align-items:center;gap:6px;height:32px;border-bottom:1px solid var(--line)}
.tc-n{width:16px;height:16px;border-radius:4px;color:#fff;display:inline-flex;align-items:center;justify-content:center;font:800 9px Figtree,system-ui,sans-serif;flex:none}
.tc-t{font:700 9.5px Figtree,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.tc-a{margin-left:auto;display:flex;align-items:center;gap:4px}
.req{height:16px;display:inline-flex;align-items:center;gap:4px;padding:0 6px;border-radius:8px;background:var(--warnbg);color:var(--warn);font:700 9.5px Figtree,system-ui,sans-serif}
.req.ok{background:var(--okbg);color:var(--ok)}
.sub{font:700 9.5px Figtree,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:8px 0 2px;display:flex;align-items:center;gap:6px}
.sub .tc-a{margin-left:auto}
.pr{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;column-gap:8px;min-width:0;padding:2px 0;border-bottom:1px solid var(--line)}
.pr.top{align-items:start}.pr.top .pl{padding-top:6px}
.pl{font:600 11.5px/1.2 Figtree,system-ui,sans-serif;color:var(--mut);min-width:0;display:flex;flex-direction:column;gap:2px}
.pl>span{overflow-wrap:anywhere;line-height:1.2}
.pv{display:flex;align-items:center;flex-wrap:wrap;gap:2px;min-width:0;padding:1px 0}
.pv>select,.pv>.in{flex:1 1 0;min-width:0}
.in,.tc select,.ta,.fx select{height:26px;border:0;border-radius:6px;background-color:transparent;padding:0 8px;font:500 12.5px Figtree,system-ui,sans-serif;color:var(--ink);min-width:0;width:100%}
.tc select,.fx select{padding-right:20px}
.in:hover,.in:focus,.tc select:hover,.tc select:focus,.ta:hover,.ta:focus{background-color:#fff}
.in::placeholder,.ta::placeholder{color:var(--mut2)}
.in.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.in.idf{flex:0 0 96px}.in.dt{flex:0 0 118px;padding:0 4px}
.ta{height:auto;min-height:40px;padding:5px 8px;resize:vertical;line-height:1.4;flex:1 1 100%}
select.csel{color:var(--cc)!important;font-weight:700}
.mini{height:24px;display:inline-flex;align-items:center;gap:4px;border:0;border-radius:6px;background:transparent;color:var(--ink2);font:600 12px Figtree,system-ui,sans-serif;padding:0 6px;white-space:nowrap;flex:none}
.mini:hover{background:#fff}
.mini svg{width:13px;height:13px}
.mini.icon{width:24px;padding:0;justify-content:center;color:var(--mut2)}
.mini.on{background:#e6f0f7;color:var(--navy)}
.mini.add{color:var(--blue)}
.chk{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 4px;font:600 12px Figtree,system-ui,sans-serif;color:var(--ink2);white-space:nowrap}
.chk input{margin:0}
.muted{color:var(--mut);font-size:11.5px}
.note{font:500 11.5px/1.45 Figtree,system-ui,sans-serif;color:var(--ink2);background:#fff;border-radius:6px;padding:5px 8px;border-left:3px solid #c9d6e2;margin:5px 0 2px}
.note.warn{border-left-color:#e3b35a;background:#fffaf0}
.note.bad{border-left-color:#d97a7a;background:#fff6f6;color:var(--bad)}
.note.ok{border-left-color:#7cc3a0}
.chips{display:flex;flex-wrap:wrap;gap:3px;padding:3px 0}
.chipx{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 3px 0 7px;border-radius:5px;background:#fff;box-shadow:0 0 0 1px var(--line);font:600 11.5px Figtree,system-ui,sans-serif;color:var(--ink2)}
.chipx button{border:0;background:transparent;color:var(--mut2);padding:0 3px;font:800 10px Figtree,system-ui,sans-serif;border-radius:3px}
.chipx button:hover{background:var(--chip);color:var(--ink)}
.rec{background:#fff;border-radius:8px;padding:2px 8px 4px;margin:4px 0;box-shadow:0 0 0 1px var(--line)}
.rec .pr{grid-template-columns:80px minmax(0,1fr)}
.rec .pr:last-child{border-bottom:0}
.rec-h{display:flex;align-items:center;gap:6px;height:26px;font:700 11.5px Figtree,system-ui,sans-serif;color:var(--ink)}
.rec-h .x{margin-left:auto}
.mpf{background:#fff;border-radius:8px;padding:2px 8px 4px;margin:4px 0;box-shadow:0 0 0 1px var(--line)}
.mpf.need{box-shadow:0 0 0 1px #e9c98a}
.mpf .pr{grid-template-columns:80px minmax(0,1fr)}
.peca{display:grid;grid-template-columns:minmax(0,1fr) 92px 112px 24px;gap:2px;align-items:center;border-bottom:1px solid var(--line);padding:1px 0}
.seg{display:inline-flex;background:#fff;border-radius:7px;padding:2px;box-shadow:0 0 0 1px var(--line);flex-wrap:wrap}
.seg button{border:0;background:transparent;height:22px;padding:0 8px;border-radius:5px;font:700 11px Figtree,system-ui,sans-serif;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--sc,var(--navy));color:#fff}
.jtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0}
.tgl{display:inline-flex;align-items:center;gap:6px;font:600 12px Figtree,system-ui,sans-serif;color:var(--ink2);white-space:nowrap;cursor:pointer;user-select:none}
.tgl .sw{width:28px;height:16px;border-radius:8px;background:#d5dde3;position:relative;transition:background .15s}
.tgl .sw::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .15s}
.tgl[aria-checked=true] .sw{background:var(--ok)}
.tgl[aria-checked=true] .sw::after{left:14px}
.tgl[aria-disabled=true]{opacity:.45;cursor:not-allowed}
.chain{display:flex;align-items:center;gap:3px;flex-wrap:wrap;font:600 11px Figtree,system-ui,sans-serif;color:var(--mut)}
.chain span{height:18px;display:inline-flex;align-items:center;padding:0 6px;border-radius:5px;background:#fff;color:var(--ink2)}
.chain span.cur{background:#e6f0f7;color:var(--navy)}

/* selos de origem do dado */
.src{display:inline-flex;align-items:center;height:14px;padding:0 4px;border-radius:3px;font:800 8.5px Figtree,system-ui,sans-serif;letter-spacing:.04em;cursor:help;flex:none;align-self:flex-start}
.s-txt{background:#e3eefa;color:#2a5d9f}.s-pje{background:#e7f2ee;color:#1d6a52}.s-pdf{background:#efe9f8;color:#6b4fa0}
.s-etq{background:#fdf0dd;color:#9a5b08}.s-regra{background:#eef2f5;color:#4b6478}.s-ia{background:#fbe8f1;color:#a23a6e}
.s-pad{background:#e6f0f7;color:var(--navy)}.s-msg{background:#e8f5f8;color:#1d6a7d}.s-acv{background:#eef4e4;color:#4f6b1f}

/* balões e diálogos */
.pop{position:absolute;z-index:40;background:#fff;border:1px solid #e1e8ee;border-radius:10px;box-shadow:0 10px 28px rgba(22,40,58,.16);padding:10px;width:260px}
.pop .k{font:700 9.5px Figtree,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.pop .in,.pop select,.pop .ta{background:var(--chip)}
.pop .ok{height:28px;border:0;border-radius:6px;background:var(--ok);color:#fff;font:700 12px Figtree,system-ui,sans-serif;padding:0 10px}
.pop .small{font:500 11px Figtree,system-ui,sans-serif;color:var(--mut);margin-top:6px}
.pop ul{list-style:none;margin:0 0 6px;padding:0;display:flex;flex-direction:column;gap:3px;max-height:220px;overflow:auto}
.pop li{display:flex;align-items:flex-start;gap:6px;font:500 11.5px/1.35 Figtree,system-ui,sans-serif;padding:5px 6px;border-radius:6px;background:var(--chip)}
.pop li.done{color:var(--mut2);text-decoration:line-through}
.pop li em{display:block;font-style:normal;color:var(--mut);font-size:11px}
.pop li .x{margin-left:auto;border:0;background:transparent;color:var(--mut);padding:0 2px}
.pop .opts{display:flex;flex-direction:column;gap:2px;max-height:200px;overflow:auto}
.pop .opts button{border:0;background:transparent;text-align:left;padding:5px 8px;border-radius:6px;font:600 12px Figtree,system-ui,sans-serif;color:var(--ink2)}
.pop .opts button:hover{background:#e6f0f7;color:var(--navy)}
.pop pre{white-space:pre-wrap;font:500 11.5px/1.45 Figtree,system-ui,sans-serif;background:var(--chip);padding:6px 8px;border-radius:6px;margin:4px 0 0;max-height:200px;overflow:auto}
.pop p{margin:3px 0;font-size:12px}
.ln{display:flex;align-items:center;gap:4px;min-width:0}
dialog{border:0;border-radius:14px;padding:0;box-shadow:0 20px 60px rgba(22,40,58,.25);width:min(980px,96vw);color:var(--ink)}
dialog::backdrop{background:rgba(18,52,64,.28)}
.dh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font:800 14px Figtree,system-ui,sans-serif}
.dh .sp{flex:1}
.db{padding:14px 16px;display:flex;flex-direction:column;gap:10px;max-height:72vh;overflow:auto;background:#f7f9fb}
.df{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.df .lgd{margin-right:auto;display:flex;gap:10px;flex-wrap:wrap;color:var(--mut);font-size:11px}
.db textarea.big{width:100%;min-height:200px;border:1px solid var(--line);border-radius:8px;padding:10px;font:500 12px/1.45 ui-monospace,Menlo,monospace;resize:vertical;background:#fff}
.sug{display:grid;grid-template-columns:20px 200px 1fr 60px;gap:6px 10px;align-items:center;font-size:12px;background:#fff;border-radius:8px;padding:8px}
.sug .h{font:700 9.5px Figtree,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.sug code{font:600 11.5px ui-monospace,Menlo,monospace;background:var(--chip);padding:2px 6px;border-radius:4px;word-break:break-word}
.out{white-space:pre-wrap;background:#fff;border-radius:8px;padding:12px;font:500 12.5px/1.6 Figtree,system-ui,sans-serif}
.out.mono{font:500 11.5px/1.5 ui-monospace,Menlo,monospace}
.tabs{display:flex;gap:2px;background:var(--chip);padding:2px;border-radius:8px}
.tabs button{border:0;background:transparent;height:26px;padding:0 12px;border-radius:6px;font:700 12px Figtree,system-ui,sans-serif;color:var(--mut)}
.tabs button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.fx-g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fx-g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fx-card{background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 0 0 1px var(--line)}
.fx-card h4{margin:0 0 6px;font:700 9.5px Figtree,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:8px}
.fx-card h4 em{margin-left:auto;font-style:normal;letter-spacing:0;text-transform:none;font-weight:600;color:var(--mut2)}
.fx-card h4 .n{width:20px;height:16px;border-radius:4px;background:var(--chip);color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;font-weight:800}
.fx-big{font:800 15px Figtree,system-ui,sans-serif;display:block}
.fx-card p{margin:4px 0 0;color:var(--ink2)}
.fx-alert{background:#fff8ee;box-shadow:0 0 0 1px #f1d9a8}
.fx-alert h4{color:var(--warn)}
.fx-pend{display:block;border:0;background:transparent;padding:2px 0;text-align:left;color:var(--ink2)}
.fx-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 14px}
.fx-f{display:flex;flex-direction:column;gap:2px;min-width:0}
.fx-f.s2{grid-column:span 2}.fx-f.s4{grid-column:1/-1}
.fx-lab{font:600 11px Figtree,system-ui,sans-serif;color:var(--mut);display:flex;align-items:center;gap:5px}
.fx-v{font:500 12.5px/1.4 Figtree,system-ui,sans-serif;white-space:pre-wrap;word-break:break-word}
.fx-v.dim{color:var(--mut2)}
.fx-v.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.fx .in,.fx select,.fx .ta{background-color:var(--chip)}
.fx-grp{font:800 11px Figtree,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);margin:4px 2px -2px}
.fx-flow{display:flex;gap:0;list-style:none;margin:0;padding:0}
.fx-flow li{flex:1;display:flex;flex-direction:column;gap:2px;position:relative;padding-top:18px;font-size:11.5px;color:var(--mut)}
.fx-flow li::before{content:"";position:absolute;top:4px;left:0;width:10px;height:10px;border-radius:50%;background:#d5dde3}
.fx-flow li::after{content:"";position:absolute;top:8px;left:14px;right:4px;height:2px;background:#e3e9ee}
.fx-flow li:last-child::after{display:none}
.fx-flow li.done::before{background:var(--ok)}.fx-flow li.cur::before{background:#d5a53f}
.fx-flow b{color:var(--ink);font-size:12px}
.integ{margin-top:16px;background:#fff;border-radius:12px;box-shadow:0 0 0 1px var(--line);padding:12px 14px}
.integ h2{margin:0 0 4px;font:800 13px Figtree,system-ui,sans-serif}
.integ p.lead{margin:0 0 10px;color:var(--mut)}
.itab{width:100%;border-collapse:collapse;font-size:12px}

<script type="application/json" id="pm-data">{"POS":[["relat","Relatório"],["admiss","Admissibilidade"],["prelim","Preliminares e prejudiciais"],["trans","Decisão recorrida"],["contro","Questão em discussão"],["jurid","Moldura jurídica"],["fatos","Na espécie: fatos"],["provas","Na espécie: provas"],["aplic","Aplicação ao caso"],["concl","Fecho da questão"],["consec","Consectários"],["honor","Honorários"],["complem","Complementos"],["disp","Dispositivo"],["fecho","Ementa e acórdão"],["revis","Revisão redacional"]],"MESTRE":{"id":"mestre","t":"Roteiro-mestre","s":"O esqueleto comum a toda minuta do gabinete, do relatório à ementa, na ordem do Manual CMT: primeiro a questão; depois norma, provas e subsunção; ao final, o precedente que ratifica.","steps":[["relat","Abertura no padrão do gabinete?","Parágrafo único: peça recorrida com ID logo após a referência; verbo nuclear do resultado (julgou, extinguiu, denegou, homologou); providências coordenadas por ponto e vírgula; ponto antes dos honorários, que abrem nova frase no mesmo parágrafo. Preservar os dados efetivos da sentença (\"valor da causa\" × \"valor atualizado da causa\").",1,"Trata-se de apelação à sentença (ID [ID]) que [julgou/extinguiu/denegou/homologou] [RESULTADO]. [Honorários advocatícios fixados em …, observada a gratuidade de justiça (artigo 98, § 3º, do CPC).]","Manual CMT"],["relat","Razões recursais enumeradas e atribuídas à parte?","Um parágrafo por recurso, sem conectivo entre recursos sucessivos; enumeração (1) …; (2) …; e (3) …, com orações no infinitivo; pedido no último item ou em \"pelo que requereu\" — nunca nas duas posições. Sem adjetivação nem apreciação da prova.",1,"Apelou [a União / a parte autora] (ID [ID]), alegando, em suma, que: (1) [ALEGAÇÃO]; (2) [ALEGAÇÃO]; e (3) [ALEGAÇÃO].","Manual CMT"],["relat","Contrarrazões, Ministério Público e ocorrências fiéis aos autos?","Contrarrazões em parágrafo próprio, com registro obrigatório só das preliminares nelas suscitadas. Parecer ministerial com ID — em segundo grau, conferir se a referência exige \"Procuradoria Regional da República\". Gratuidade, multa, parecer e ocorrências apenas se constarem dos autos.",0,"Houve contrarrazões (ID [ID]). / Não houve contrarrazões.\nO Ministério Público Federal opinou pelo [RESULTADO] (ID [ID]).\nÉ o relatório.","Manual CMT"],["admiss","O recurso é tempestivo e estão presentes os demais requisitos de admissibilidade?","Prazo em dias úteis (artigo 219 do CPC), em dobro para a Fazenda Pública (artigo 183 do CPC). Sem preparo comprovado na interposição, a deserção só se declara após intimação para recolhimento em dobro (artigo 1.007, § 4º, do CPC).",1],["admiss","As razões enfrentam os fundamentos da decisão recorrida?","Dialeticidade (artigo 1.010, II e III, do CPC). Fundamento autônomo não impugnado sustenta, por si, a decisão: conhecimento parcial, registrado já na abertura do voto.",0,"Senhores Desembargadores, conheço [em parte] da apelação, pois [foi cumprido o requisito da dialeticidade / não se tratou na sentença da questão …].","votos do acervo"],["admiss","Há inovação recursal?","Matéria não deduzida na origem não se conhece, ressalvadas as questões de ordem pública e a força maior (artigo 1.014 do CPC)."],["prelim","Algum tema afetado manda suspender este grau?","Ler o alcance da ordem de suspensão na decisão de afetação: muitas alcançam apenas REsp e AREsp na Vice-Presidência ou no Superior Tribunal de Justiça, o que não impede o julgamento da apelação.",1,"cabe observar, inicialmente, que não se cogita de sobrestamento do feito, por afetação do Tema [Nº]/STJ, pois tal providência somente foi determinada em relação aos casos de recurso especial ou agravo em recurso especial em tramitação na Vice-Presidência da Corte ou no próprio Superior Tribunal de Justiça ([ProAfR no REsp …], Rel. Min. [NOME], julgado em [DATA]), não obstando, portanto, o julgamento do presente recurso.","votos do 28,86%"],["trans","Fundamento decisivo da decisão recorrida identificado?","Transcrever apenas o trecho que sustenta a conclusão impugnada — é o alvo do recurso e a régua da dialeticidade. O voto não repete o relatório: vai direto à questão.",0,"bem decidiu a sentença (ID [ID]):\n\"[TRECHO DECISIVO]\"","Manual CMT"],["contro","Questão em discussão formulada numa frase?","Havendo mais de uma, numerá-las — (1), (2) — e manter a mesma ordem na fundamentação, no fecho e na ementa. A questão nunca vira subtítulo: o voto não se fragmenta em tópicos.",1,"Senhores Desembargadores, a controvérsia envolve discutir [se …]. \n— ou —\nA controvérsia envolve discutir: (1) [QUESTÃO]; e (2) [QUESTÃO].","Manual CMT"],["jurid","Moldura normativa exposta antes do caso?","Dispositivos transcritos quando úteis, em parágrafo próprio, entre aspas e em itálico, com destaques \"(g.n.)\". Comentário após a norma com \"Note-se que\", \"Como se observa\", \"Vale lembrar\". Identificar a categoria jurídica antes dos requisitos.",1],["jurid","Precedente qualificado localizado, transcrito e conferido?","Tema, súmula, IRDR ou IAC aplicável: transcrever a tese, não apenas o número; conferir redação vigente, modulação e data. Hierarquia: Supremo Tribunal Federal → Superior Tribunal de Justiça → TRF-3. Precedente da TNU é vedado.",1],["fatos","Fatos introduzidos por \"Na espécie,\" e amarrados ao ID?","O incontroverso entra como premissa, com o ID do documento; marcos temporais concretos (DD/MM/AAAA). Alegação não é fato demonstrado.",1,"Na espécie, [FATO JURIDICAMENTE RELEVANTE], conforme [DOCUMENTO] (ID [ID]), circunstância que [preenche/afasta] os requisitos previstos no artigo [DISPOSITIVO] da [NORMA].","Manual CMT"],["provas","Cada fato decisivo amarrado a documento (ID e folha)?","Forma \"(ID [ID], f. [X]/[Y])\" — nunca \"fls.\" nem \"conforme os autos\". Indicar quem tinha o ônus e se dele se desincumbiu; distinguir ausência de comprovação, insuficiência e prova de inexistência; dizer o que a prova demonstra e o que não demonstra.",1,"O laudo pericial judicial (ID [ID]) examinou [OBJETO] e concluiu por [CONCLUSÃO].","Manual CMT"],["aplic","Cada alegação recursal enfrentada, sem rejeição genérica?","Argumento capaz de infirmar a conclusão exige resposta (artigo 489, § 1º, IV, do CPC). Responder ponto a ponto com fórmula adversativa ou concessiva: \"Contrariamente ao sustentado\", \"Nem se alegue que\", \"Ainda que\".",1],["aplic","O caso se amolda à tese ou exige distinção?","Afastar precedente invocado pela parte exige demonstrar a distinção ou a superação (artigo 489, § 1º, VI, do CPC).",1,"Não se aplica à espécie o entendimento firmado no [PRECEDENTE], pois [DISTINÇÃO DETERMINANTE].","Manual CMT"],["aplic","Precedente de ratificação depois do raciocínio?","O precedente confirma, não inaugura: nunca abrir a questão por \"Neste sentido\". Citação com classe e número, relator em caixa alta, veículo e data de publicação.",0,"Em casos que tais, assim tem decidido esta Turma Regional:\n\nApCiv [NÚMERO], Rel. Des. Fed. [NOME EM CAIXA ALTA], DJEN [DD/MM/AAAA]: \"[EMENTA]\" (g.n.)","Manual CMT"],["concl","Cada questão tem fecho próprio?","Fecho curto por questão, sem síntese redundante.",0,"Em suma, [CONCLUSÃO].\n— ou —\nAssim, nada colhe o recurso [da autora / da autarquia ré].\n— ou —\nAfigura-se, pois, correta a solução dada na origem.\n— ou —\nNão se cogita, pois, de [TESE AFASTADA], sob tal enfoque.","Manual CMT · votos do acervo"],["consec","A reforma altera sucumbência, juros ou correção?","Consectários só quando há condenação; inverter ou redistribuir a sucumbência quando o resultado muda.",0,"Em razão da reforma da sentença, impõe-se a inversão da sucumbência, [CRITÉRIOS].","Manual CMT"],["honor","Sucumbência recursal tratada?","Majoração de 1% somente se o recurso for integralmente desprovido ou não conhecido, contra decisão publicada a partir de 18/03/2016 e com honorários fixados na origem, respeitados os limites dos §§ 2º e 3º (Tema 1.059/STJ). Contrarrazões não são requisito. Sentença anulada, processo extinto ou remetido pela preliminar: rever os honorários, sem majoração. Mandado de segurança não comporta honorários (Súmula 512/STF; artigo 25 da Lei 12.016/2009).",1,"Pela sucumbência recursal, [a parte] deve suportar condenação adicional (artigo 85, § 11, do CPC), no equivalente a 1%, a ser acrescido ao fixado na origem, observada a gratuidade de justiça concedida (artigo 98, § 3º, do CPC).","Manual CMT · votos do acervo"],["complem","Pedidos residuais enfrentados?","Litigância de má-fé, gratuidade impugnada, prequestionamento expresso, pedidos condicionados que ficaram prejudicados.",0,"A despeito da improcedência da pretensão recursal, não cabe cogitar, como apontado em contrarrazões, de sanção processual, pois não evidenciado exercício abusivo do direito recursal ou de ação para efeito de litigância de má-fé, fato grave a exigir demonstração inequívoca, inexistente na espécie.","votos do 28,86%"],["disp","Dispositivo coerente com o conhecimento e com o resultado?","\"Ante o exposto,\" + resultado + \"É como voto.\". Usar \"apelação\", não \"recurso\"; com apelante único, não o especificar; recurso adesivo e remessa necessária no mesmo dispositivo; preferir \"para anular\" e \"regular prosseguimento do feito\"; sem \"nos termos da fundamentação\".",1,"Ante o exposto, nego provimento à apelação.\n— ou —\nAnte o exposto, conheço em parte da apelação e nego-lhe provimento.\n— ou —\nAnte o exposto, dou provimento à apelação para reformar a sentença e determinar o retorno dos autos à origem para regular prosseguimento do feito.\n\nÉ como voto.","Manual CMT · votos do acervo"],["disp","Tipo de voto no PJe compatível com o dispositivo?","\"Provido\", \"não provido\", \"conhecido em parte e não provido\" etc. \"Procedência\" e \"improcedência\" ficam reservadas às sentenças; embargos de declaração são acolhidos ou rejeitados, nunca \"providos\"."],["fecho","Ementa na estrutura do gabinete (Recomendação CNJ 154/2024 adaptada)?","Cabeçalho em caixa alta — ramo do Direito · classe · assunto · conclusão, até três linhas → I. CASO EM EXAME → II. QUESTÃO EM DISCUSSÃO → III. RAZÕES DE DECIDIR → IV. DISPOSITIVO (\"IV. DISPOSITIVO E TESE\" só se houver tese) → linha → rodapé. Numeração contínua entre seções, sem saltos; um fundamento por item.",1,"DIREITO [RAMO]. [CLASSE]. [ASSUNTO]. [CONCLUSÃO].\nI. CASO EM EXAME\n1. [Apelação contra sentença que …].\nII. QUESTÃO EM DISCUSSÃO\n2. A questão em discussão consiste em saber se [ …].\nIII. RAZÕES DE DECIDIR\n3. [FUNDAMENTO].\n4. [FUNDAMENTO].\nIV. DISPOSITIVO\n5. [Apelação desprovida.]\n__________\nDispositivos relevantes citados: [CF/1988, artigo …; Lei …/…, artigo …; e CPC, artigo …].\nJurisprudência relevante citada: [STF, RE …, Rel. Min. NOME, DJe DD/MM/AAAA; STJ, REsp …; e TRF-3, ApCiv …, Rel. Des. Fed. NOME, DJEN DD/MM/AAAA].","Manual CMT · Recomendação CNJ 154/2024"],["fecho","Ementa limpa e fiel ao voto?","Sem ID, sem nome das partes, sem \"trata-se de\", sem doutrina, sem TNU; \"União\", nunca \"União Federal\"; frases de até 40 palavras. Rodapé: diplomas na ordem hierárquica e julgados na ordem STF → STJ → TRF-3, com relator em caixa alta e DJe/DJEN. Tema aplicado: tese transcrita no voto."],["fecho","Acórdão espelha o dispositivo?","O resultado reproduz literalmente o dispositivo do voto, com a pessoa verbal ajustada (\"nego\" → \"negou\").",0,"Vistos e relatados estes autos em que são partes as acima indicadas, a Turma Regional de Mato Grosso do Sul, por unanimidade, [RESULTADO], nos termos do relatório e voto que ficam fazendo parte integrante do presente julgado.","Guia de Conformidade"],["revis","Revisão de forma concluída?","Aglutinações (\"Naespécie\", \"embargosde\"), espaço após ponto no cabeçalho da ementa, datas truncadas, crase e regência (\"dada a regência\", \"a toda lógica\"), concordância com o gênero da parte e numeração da ementa sem saltos."]]},"ESP":[{"id":"apc","t":"Apelação cível","s":"Sentença de 1º grau.","steps":[["admiss","Efeito suspensivo: regra ou exceção?","Regra do artigo 1.012 do CPC; exceções do § 1º; pedido autônomo ao Tribunal conforme o § 3º. Examinado o mérito, o pedido fica prejudicado.",0,"prejudicado o pedido de efeito suspensivo pelo exame direto do mérito.","Manual CMT"],["prelim","Interlocutórias não agraváveis devolvidas em preliminar?","Suscitadas em preliminar de apelação ou em contrarrazões (artigo 1.009, § 1º, do CPC)."],["jurid","Extensão do efeito devolutivo delimitada?","Capítulos impugnados e questões suscitadas (artigo 1.013, §§ 1º e 2º, do CPC); causa madura (artigo 1.013, § 3º, do CPC). No relatório, delimitar o que foi impugnado; no voto, não avançar sobre capítulo não recorrido.",0,"Anulada a sentença, cabe proceder de imediato a novo julgamento nesta instância.","Guia de Conformidade"],["disp","Recurso adesivo e remessa necessária julgados no mesmo dispositivo?","Registrar o resultado de cada recurso; com dupla apelação, identificar o recorrente.",0,"Ante o exposto, nego provimento à apelação [da parte exequente] e ao recurso adesivo [da FUNASA].","votos do 28,86%"]],"arm":["Esquecer o recurso adesivo no dispositivo.","Majorar honorários em recurso parcialmente provido ou quando a origem não os fixou."]},{"id":"ai","t":"Agravo de instrumento","s":"Decisão interlocutória de 1º grau.","steps":[["admiss","Cabimento: rol do artigo 1.015 do CPC ou urgência?","Taxatividade mitigada quando a espera pela apelação tornaria inútil o exame (Tema 988/STJ).",1],["admiss","Peças e comunicações em ordem?","Artigo 1.017 do CPC (instrução) e artigo 1.018 do CPC (comunicação ao juízo, nos autos físicos)."],["prelim","Pedido de efeito suspensivo ou de tutela recursal?","Probabilidade do direito e perigo de dano (artigos 300 e 1.019, I, do CPC). Requisitos cumulativos: ausente um, fica prejudicado o outro."],["aplic","O exame ficou nos limites da decisão agravada?","Efeito restrito à matéria impugnada: não antecipar o mérito da causa; reexaminar os pressupostos da interlocutória."],["complem","Sobreveio sentença?","Perda superveniente do objeto do agravo."],["honor","Honorários a tratar?","Em regra, são tratados na ação originária; majorar somente se a decisão agravada os fixou.",0,"Quanto aos honorários advocatícios, devem ser tratados na ação originária, já que se trata, nesta sede, apenas de agravo de instrumento contra decisão de natureza interlocutória, que não põe termo, portanto, ao processo.","Compêndio de modelos"],["fecho","Comunicação ao Juízo de origem?","Fecho processual próprio do agravo, em linhas separadas.",0,"Comunique-se o Juízo de origem.","Manual CMT"]],"arm":["Conhecer de agravo contra matéria que pode aguardar a apelação.","Falar em \"efeito devolutivo em profundidade\" no agravo de instrumento."]},{"id":"ain","t":"Agravo interno","s":"Decisão monocrática do relator ou da Presidência.","steps":[["relat","Abertura própria do agravo interno?","Indicar a decisão agravada e o recurso de origem.",0,"Trata-se de agravo interno à negativa de provimento a agravo de instrumento interposto contra decisão que [OBJETO].\nAlegou o agravante, em suma (ID [ID]): (1) …; e (2) … .","Guia de Conformidade"],["prelim","Juízo de retratação considerado?","O relator pode retratar-se antes de levar o recurso à Turma."],["admiss","Impugnação específica da decisão monocrática?","Artigo 1.021, § 1º, do CPC; Súmula 182/STJ.",1],["aplic","O voto vai além da decisão agravada?","Vedado limitar-se a reproduzi-la (artigo 1.021, § 3º, do CPC). A fundamentação per relationem é admitida como reforço (Tema 1.306/STJ), não como substituto do enfrentamento.",0,"Embora os fundamentos já expostos possam ser, em princípio, adotados mediante a técnica da fundamentação per relationem, admitida pela jurisprudência da Corte Superior, conforme assentado no Tema 1.306, são aqui reproduzidos como elemento de reforço da solução adotada e contextualização da controvérsia:","Guia de Conformidade"],["complem","Multa por agravo manifestamente inadmissível ou improcedente?","Exige votação unânime (artigo 1.021, § 4º, do CPC). Distinção ou superação fundamentadamente alegada afasta a multa (Tema 1.201/STJ, item 2); alegação genérica não.",0,"À luz do item \"2\" da tese firmada no Tema 1.201/STJ, não se impõe a aplicação da multa prevista no artigo 1.021, § 4º, do CPC quando alegada fundamentadamente a distinção ou a superação do precedente qualificado. Contudo, a alegação, da forma como apresentada, permanece genérica, circunstância que enseja a aplicação da multa prevista no artigo 1.021, § 4º, do CPC, no patamar de 1% do valor da causa, em favor da parte agravada.","Guia de Conformidade"],["disp","Dispositivo do agravo interno?","Única hipótese em que o acervo remete à fundamentação — para a multa.",0,"Ante o exposto, nego provimento ao agravo interno [e aplico multa, nos termos da fundamentação].","Guia de Conformidade"]],"arm":["Confundir com o agravo do artigo 1.042 do CPC (inadmissão de REsp/RE).","Majorar honorários contra decisão que já os majorou."]},{"id":"ed","t":"Embargos de declaração","s":"Qualquer decisão.","steps":[["relat","Abertura com a ementa embargada?","Transcrever a ementa integral entre aspas curvas e sintetizar os vícios alegados.",0,"Trata-se de embargos de declaração contra acórdão assim ementado: \"[EMENTA]\".\nAlegou-se omissão, inclusive em prequestionamento, pois: (1) …; e (2) … .","Guia de Conformidade"],["admiss","Prazo de cinco dias e vício apontado?","Omissão, contradição, obscuridade ou erro material (artigo 1.022 do CPC).",1],["aplic","Vício real ou rediscussão?","Rediscussão do mérito não é omissão. Demonstrar, ponto a ponto, onde o acórdão tratou da matéria (\"Com efeito, resta evidenciado o intento de mera rediscussão da causa, pois o acórdão embargado consignou expressamente …\").",1,"Senhores Desembargadores, verifica-se dos autos que os embargos de declaração não apontam vícios de omissão, contradição, obscuridade ou erro material sanáveis na via eleita, mas mera impugnação ao acórdão embargado, que teria incorrido em error in judicando, desvirtuando, pois, a própria natureza do recurso, que não é a de reapreciar a causa como pretendido.\n\nComo se observa, não se trata de omissão ou qualquer outro vício sanável na via eleita, pois o que se pretende é rediscutir a matéria decidida, alegando que houve error in judicando, o que não se presta à discussão em embargos de declaração. Se tal motivação é equivocada ou insuficiente, fere as normas apontadas (artigos …) ou contraria julgados ou jurisprudência, deve a embargante veicular recurso próprio para a impugnação do acórdão e não rediscutir a matéria em embargos de declaração.","Guia de Conformidade · Manual CMT"],["complem","Prequestionamento ficto registrado?","Artigo 1.025 do CPC. Atenção à forma correta: \"com os apontamentos destacados\".",0,"Embora tratados todos os pontos de relevância e pertinência à demonstração de que não houve qualquer vício no julgamento, é expresso o artigo 1.025 do Código de Processo Civil em enfatizar que se consideram incluídos no acórdão os elementos suscitados pela embargante, ainda que inadmitido ou rejeitado o recurso, para efeito de prequestionamento, aperfeiçoando-se, pois, com os apontamentos destacados o julgamento cabível no âmbito da Turma.","Guia de Conformidade"],["complem","Efeitos infringentes?","Intimar o embargado antes (artigo 1.023, § 2º, do CPC)."],["complem","Embargos protelatórios?","Multa (artigo 1.026, § 2º, do CPC); embargos com notório propósito de prequestionamento não são protelatórios (Súmula 98/STJ)."],["disp","Dispositivo: acolher ou rejeitar?","Nunca \"dar provimento\" a embargos. Ementa: \"Embargos de declaração rejeitados.\" — cabeçalho \"… VÍCIOS INEXISTENTES. REJEIÇÃO.\"",1,"Ante o exposto, rejeito os embargos de declaração.\n— ou —\nAnte o exposto, acolho parcialmente os embargos de declaração para, sem efeitos modificativos, acrescer fundamentação [ …].\n\nÉ como voto.","Manual CMT"]],"arm":["Rejeitar sem enfrentar ponto relevante e capaz de infirmar a conclusão.","Falar em \"provimento\" de embargos de declaração.","\"Com os apontados destacados\" no fecho do artigo 1.025 — o correto é \"apontamentos\"."],"matriz":"matriz-ed"},{"id":"rn","t":"Remessa necessária","s":"Sentença contrária à Fazenda Pública.","steps":[["admiss","A sentença está sujeita ao reexame?","Hipóteses e dispensas do artigo 496 do CPC (valor, súmula, repetitivo, orientação administrativa). Previdenciário com condenação aferível por simples cálculo abaixo do limite do § 3º, I: remessa dispensada (Tema 1.081/STJ).",1],["aplic","Reexame sem agravar a Fazenda?","Súmula 45/STJ."],["disp","Remessa e apelação julgadas em conjunto?","Dispositivo único, com o resultado de cada uma.",0,"Ante o exposto, nego provimento à apelação e à remessa necessária.\n— ou —\nAnte o exposto, dou provimento à apelação e à remessa necessária para [denegar o mandado de segurança].","votos do acervo"]],"arm":["Conhecer de remessa em causa abaixo do limite do § 3º.","Chamar de \"duplo grau obrigatório\" ou \"revisão de ofício\"."]},{"id":"cs","t":"Cumprimento contra a Fazenda","s":"Cumprimento de título judicial, individual ou coletivo.","steps":[["prelim","Exequente dentro dos limites subjetivos do título?","Ler pedido, causa de pedir e dispositivo do título; exclusões expressas (outras ações, acordos).",1],["jurid","Prescrição da pretensão executiva?","Súmula 150/STF; atos interruptivos; remeter à origem se depender de prova."],["jurid","Título fundado em lei declarada inconstitucional?","Artigo 535, § 5º, do CPC (Tema 360/STF) e Tema 733/STF. Após a AR 2.876-QO (23/04/2025), o § 7º do artigo 535 foi declarado inconstitucional e o § 8º recebeu interpretação conforme: rescisória em dois anos do trânsito da decisão do Supremo Tribunal Federal, com efeitos retroativos limitados a cinco anos do ajuizamento, salvo modulação expressa."],["consec","Juros e correção: o título ou a tese vinculante?","Tema 1.170/STF: os juros do artigo 1º-F da Lei 9.494/1997 aplicam-se às condenações não tributárias mesmo havendo previsão diversa no título. Selic a partir de 09/12/2021 (EC 113/2021); requisitórios federais expedidos desde 09/09/2025: IPCA + juros simples de 2% ao ano, limitados à Selic (artigo 3º da EC 113/2021, na redação da EC 136/2025)."],["disp","Requisição adequada?","RPV ou precatório, conforme o valor."]],"arm":["Rediscutir na execução o que a coisa julgada fixou.","Chamar de \"execução de sentença\" o cumprimento cível."]},{"id":"mono","t":"Decisão monocrática","s":"Decisões terminativas e interlocutórias do relator.","steps":[["relat","Estrutura da decisão?","\"Vistos.\" em parágrafo próprio → síntese iniciada por \"Trata-se de\" → \"DECIDO.\" → fundamentação objetiva → dispositivo.",0,"Vistos.\n\nTrata-se de [RECURSO] interposto em [AÇÃO] …\n\nDECIDO.","Manual CMT · Compêndio"],["admiss","Fundamento legal da via singular expresso?","Citar o inciso do artigo 932 do CPC e o precedente que autoriza o julgamento monocrático.",1],["disp","Dispositivo em primeira pessoa, com fundamento?","Não conheço, julgo prejudicado, homologo, declino da competência. Despacho não leva \"Ante o exposto\".",0,"Ante o exposto, com esteio no artigo 932, III, do CPC, não conheço da apelação.\n— ou —\nHomologo o pedido de desistência da apelação (ID [ID]), nos termos do artigo 998 do CPC.","Manual CMT · Compêndio"],["fecho","Fecho processual na ordem do gabinete?","Uma fórmula por linha.",0,"Publique-se. Intime-se.\nOportunamente, baixem os autos à Vara de origem.\nCampo Grande, data da assinatura.","Manual CMT"]],"arm":["Desistência do recurso com majoração de honorários — incabível, pois não há julgamento do recurso.","Despacho com \"Ante o exposto\"."]}],"pref":[{"p":"União","e":"União Federal"},{"p":"Supremo Tribunal Federal","e":"STF no corpo do voto, salvo exceções do Manual"},{"p":"Superior Tribunal de Justiça","e":"STJ no corpo do voto, salvo exceções"},{"p":"Lei 13.105/2015","e":"Lei nº 13.105/2015"},{"p":"A sentença reconheceu…","e":"A r. sentença reconheceu…"},{"p":"A /* ═════════ Prontuário (#alt-qp) · checklist de preenchimento rápido ═════════
   Espécie no alto, seções numeradas com contagem, rótulo à esquerda e opções em botões (até 5; clicar de novo limpa);
   listas maiores seguem como seleção. Mesmas chaves do card: o que se marca aqui aparece no card e nas integrações. */
const AB={'Não se Aplica':'N/A','Não se aplica':'N/A','Não Verificado':'Não verif.','Com Parecer':'Com parecer','Sem Parecer':'Sem parecer','Não Recolhido':'Não recolh.','Comprovado':'Compr.',
  'Prosseguimento do feito':'Prosseguimento','Provimento do recurso':'Provimento','Não provimento do recurso':'Não provimento','RETIRADO DE PAUTA':'Retirado','Por maioria':'Maioria',
  'Sem impedimento':'Sem imped.','Majorar (art. 85, § 11, CPC)':'Majorar (§ 11)','Não requerido':'Não req.','Pendente de análise':'Pendente','Sujeita (art. 496)':'Sujeita','Não sujeita':'Não sujeita'};
const ab=t=>{t=S(t);return AB[t]||t;};
const TONE=v=>{const n=norm(v);if(!n||/^(nao verificado|nao se aplica)$/.test(n))return '';if(/intempest|nao recolh|negativo|faltante|^impedimento|^suspeicao|sem parecer|^negar|^rejeitar|nao provimento/.test(n))return 'x';if(/^tempestivo|comprovado|dispensado|^regular|juntada|com parecer|^nao$|^dar provimento|^acolher|^exercer/.test(n))return 'ok';return '';};
function seg(r,k,L,o={}){const v=S(o.val!==undefined?o.val:getP(r,k));const list=L.map(x=>Array.isArray(x)?x:[x,x]).filter(([x])=>x!=='');
  if(list.length>5)return sel(r,k,L,o);
  return `<span class="qp-seg" role="group">${list.map(([x,t])=>`<button type="button" class="qp-sb${v===x?' on '+TONE(x):''}" data-act="qset" data-k="${esc(k)}" data-v="${esc(x)}" title="${esc(t)}" aria-pressed="${v===x}">${esc(ab(t))}</button>`).join('')}</span>`;}
const QR=(r,label,key,body,o={})=>body?`<div class="qp-r${o.top?' top':''}"><span class="qp-l"><span>${esc(label)}</span>${key?badge(r,key,o.src):''}</span><div class="qp-c">${body}</div></div>`:'';
const QS=(n,t,q,body)=>`<section class="qp-s"><h4><i>${n}</i>${esc(t)}${q&&q[1]?`<em class="req${q[0]===q[1]?' ok':''}">${q[0]}/${q[1]}</em>`:''}</h4>${body}</section>`;

/* ═══ Painel de Diretrizes (v272) — camada de redesign, sem substituir o checklist ═══
   Mesmo registro do card, labels atuais: Subassunto -> Tema e Especificidades -> _pautaSpecificities.
   A prévia usa o índice JUR embutido; no app implantado, CMTCorresp consulta /api/paradigmas. */
const dNorm=v=>S(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const dTokens=v=>[...new Set(dNorm(v).split(/[^a-z0-9]+/).filter(w=>w.length>=5&&!['direito','processo','processual','federal','recurso','juridico','sentenca','tribunal','apelacao','agravo','especial','julgamento','constituicao','sobre','para','outros','outras'].includes(w)))];
const dzNum=n=>S(n).replace(/\D/g,'');
function dzMatch(r){
 const txt=[r.Assunto,r.Tema,(r._pautaSpecificities||[]).join(' '),(r.Etiquetas||[]).join(' '),ST.qpKw[r.id]?.join(' ')||''].join(' ');
 const tokens=dTokens(txt),base=dNorm(r.Assunto),tema=dNorm(r.Tema);
 const own=[],similar=[];
 for(const j of JUR){
   if(dzNum(j.n)===dzNum(r.Processo)){own.push({j,sc:100});continue;}
   const je=dNorm(j.e),matches=tokens.filter(t=>je.includes(t)).length;
   const p=matches/Math.max(1,Math.min(tokens.length,9));
   const topic=tema&&je.includes(tema)?25:0,subject=base&&je.includes(base)?36:0;
   const score=Math.round(Math.min(99,p*66+topic+subject));
   if(score>=28&&matches>=1)similar.push({j,sc:score});
 }
 similar.sort((a,b)=>b.sc-a.sc||b.j.d.localeCompare(a.j.d));
 return {own,similar,modos:PM.ESP.filter(x=>[r.Assunto,r.Tema].join(' ').toLowerCase().includes(x.id))};
}
function qpTabNav(r){
 const matches=dzMatch(r),cnt=matches.own.length+matches.similar.length;
 return `<nav class="qp-tabset" role="tablist" aria-label="Painel do prontuário">
   <button type="button" role="tab" data-act="qp-tab" data-v="prontuario" aria-selected="true" class="active">${svg('list',13)} Prontuário</button>
 </nav>`;
}
const DZ_TABS=[['ger','Gerais'],['rel','Relatório'],['min','Minuta'],['voc','Vocabulário']];
function jurTipo(j){const t=dNorm((j.e||'')+' '+(j.r||'')+' '+(j.cl||'')+' '+(j.c||''));if(/embargos de declaracao/.test(t))return 'Embargos de declaração';if(/embargos de terceiro/.test(t))return 'Embargos de terceiro';if(/agravo interno/.test(t))return 'Agravo interno';if(/juizo de retratacao|retrata[cç]ao/.test(t))return 'Juízo de retratação';if(/agravo de instrumento/.test(t)||j.c==='AI')return 'Agravo de instrumento';if(/remessa necessaria|remessa oficial/.test(t)&&!/apelacao/.test(t))return 'Remessa necessária';if(/apelacao/.test(t)||/^Ap/.test(j.c||''))return 'Apelação';return j.cl||j.c||'Outro';}
function corrFilters(r){ST.qpCorrFilters=ST.qpCorrFilters||{};return ST.qpCorrFilters[r.id]||(ST.qpCorrFilters[r.id]={q:'',resultado:'',classe:'',tipo:''});}
function corrPass(j,f){const all=dNorm((j.e||'')+' '+(j.r||'')+' '+(j.c||'')+' '+(j.cl||''));if(f.q&&!dNorm(f.q).split(/\s+/).filter(Boolean).every(w=>all.includes(w)))return false;if(f.resultado&&!dNorm(j.r||'').includes(dNorm(f.resultado)))return false;if(f.classe&&!(dNorm(j.c||'').includes(dNorm(f.classe))||dNorm(j.cl||'').includes(dNorm(f.classe))))return false;if(f.tipo&&dNorm(jurTipo(j))!==dNorm(f.tipo))return false;return true;}
function dzList(L,f){const X=L.filter(x=>corrPass(x.j,f));return X.length?X.slice(0,12).map(({j,sc})=>`<article class="dz-match"><div class="dz-match-head"><b>${esc(j.c)} · ${esc(j.n)}</b><span>${esc(br(j.d))}</span><em class="dz-aff" title="Índice aproximado, apenas nesta prévia">${sc}%</em></div><div class="dz-match-title">${esc(j.e.slice(0,120))}</div><p>${esc(j.r||'')}</p><small class="muted">${esc(jurTipo(j))}${j.cl?' · '+esc(j.cl):''}</small><button type="button" data-act="dz-copy" data-v="${esc(j.id)}" class="dz-btn">Copiar referência</button></article>`).join(''):'<p class="dz-empty">Nenhum julgado atende aos filtros atuais.</p>';}
function corrBody(r){
 const e=espInfo(r),match=dzMatch(r),kw=ST.qpKw[r.id]||[],f=corrFilters(r);
 const L=(typeof similares==='function'?similares(r,ST.gerQ||''):[]);
 const classes=[...new Set(JUR.map(j=>j.cl||j.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
 const tipos=['Apelação','Remessa necessária','Embargos de declaração','Agravo interno','Agravo de instrumento','Juízo de retratação','Embargos de terceiro'];
 const LF=L.filter(x=>corrPass(x.j,f));
 const simCards=LF.length?LF.slice(0,12).map(({j,s,hit})=>`<article class="dz-match"><div class="dz-match-head"><b>${esc(j.c)} · ${esc(j.n)}</b><span>${esc(br(j.d))}</span><em class="dz-aff" title="Aderência calculada a partir dos dados estruturados do card">${Math.round(s*10)/10}</em></div><div class="dz-match-title">${esc(j.e.slice(0,150))}</div><p>${esc(j.r||'')}</p><small class="muted">${esc(jurTipo(j))}${hit?.length?' · Coincidências: '+esc(hit.join(' · ')):''}</small><button type="button" data-act="dz-copy" data-v="${esc(j.id)}" class="dz-btn">Copiar referência</button></article>`).join(''):'<p class="dz-empty">Nenhum similar estrutural atende aos filtros atuais.</p>';
 const corrCount=match.similar.filter(x=>corrPass(x.j,f)).length;
 return `<div class="qp-b dz-b"><div class="dz-toolbar"><span class="item cx${Math.max(1,CX.findIndex(x=>x[0]===r.COMPLEXIDADE)+1)}">${esc(r['Item (Pauta de Julgamento)'])}</span><div><b class="num">${esc(r.Processo)}</b><br><small>${esc(r.Assunto||'')}</small></div></div>
 <div class="dz-section"><h3>Correspondências</h3><div class="dz-stats"><span><b>${match.own.length}</b>Paradigmas próprios</span><span><b>${corrCount}</b>Correspondências por conteúdo</span><span><b>${LF.length}</b>Similares por aderência estrutural</span></div><div class="dz-info">Uma única consulta, com dois critérios complementares. <b>Correspondências</b> procuram coincidência temática no conteúdo do julgado; <b>Similares</b> calculam aderência aos dados estruturados do card (assunto, subassunto, especificidades, etiquetas, classe e espécie efetivamente julgada).</div>
 <div class="dz-searchgrid"><label>Busca livre<input data-corr="q" value="${esc(f.q)}" placeholder="tema, fato, tese, palavra-chave"></label><label>Resultado do acórdão/decisão<input data-corr="resultado" value="${esc(f.resultado)}" placeholder="ex.: negou provimento"></label><label>Classe / espécie<select data-corr="classe"><option value="">Todas</option>${classes.map(x=>`<option value="${esc(x)}"${f.classe===x?' selected':''}>${esc(x)}</option>`).join('')}</select></label><label>Julgamento efetivo<select data-corr="tipo"><option value="">Todos</option>${tipos.map(x=>`<option value="${esc(x)}"${f.tipo===x?' selected':''}>${esc(x)}</option>`).join('')}</select></label></div>
 <div class="dz-kindnote"><b>Processo atual:</b> classe cadastrada ${esc(r.classe_judicial||'—')} · julgamento efetivo ${esc(e.rot)} · resultado ${esc(r['Voto - Resultado']||'ainda não definido')}.</div>
 <div class="dz-kw"><input id="dzNewKw" placeholder="Palavra-chave adicional do caso" aria-label="Nova palavra-chave"><button data-act="dz-kw-add">+ Incluir</button></div><div class="dz-chips">${kw.map((w,i)=>`<button data-act="dz-kw-remove" data-i="${i}" title="Remover palavra-chave">${esc(w)} ×</button>`).join('')}</div><p><b>Assunto:</b> ${esc(r.Assunto||'—')}</p><p><b>Subassunto:</b> ${esc(r.Tema||'—')}</p><p><b>Especificidades:</b> ${esc((r._pautaSpecificities||[]).join(' · ')||'—')}</p><p><b>Espécie efetivamente julgada:</b> ${esc(e.rot)}</p></div>
 <div class="dz-section"><h3>Paradigmas próprios</h3><div class="dz-kindnote">Julgados previamente reconhecidos como paradigmas do próprio processo ou correspondência direta.</div>${dzList(match.own,f)}</div>
 <div class="dz-section"><h3>Casos correspondentes · conteúdo</h3><div class="dz-kindnote">Coincidência temática extraída do texto da ementa/resultado a partir de assunto, subassunto e palavras-chave do caso.</div>${dzList(match.similar,f)}</div>
 <div class="dz-section"><h3>Similares · aderência estrutural ao card</h3><div class="dz-kindnote">Ranking ponderado pelos campos do processo: subassunto, etiquetas, especificidades, Tema, classe e espécie efetivamente em julgamento.</div>${simCards}</div></div>`;
}

 const pos=Object.fromEntries(PM.POS),rmap={apel:'apc',ed:'ed',et:'mestre',agint:'ain',ai:'ai',jr:'jr',rn:'rn'};

 }
 return `<div class="qp-b dz-b"><div class="dz-toolbar"><span class="item cx${Math.max(1,CX.findIndex(x=>x[0]===r.COMPLEXIDADE)+1)}">${esc(r['Item (Pauta de Julgamento)'])}</span><div><b class="num">${esc(r.Processo)}</b><br><small>${esc(r.Assunto||'')}</small></div></div><nav class="dz-t" role="tablist" aria-label="Seções de diretrizes">${DZ_TABS.map(([t,name])=>`<button type="button" role="tab" data-act="qp-dz-tab" data-v="${t}" aria-selected="${tab===t}" class="${tab===t?'on':''}">${name}</button>`).join('')}</nav>${html}</div>`;

/* Roteiro contextual embutido no prontuário — utiliza a mesma espécie do card. */
function qpRoteiroIntegrado(r){
 const e=espInfo(r), map={apel:'apc',ed:'ed',et:'mestre',agint:'ain',ai:'ai',jr:'jr',rn:'rn'};
 const k=e.rnOnly?'rn':(map[e.k]||'apc');
 const guia=PM.ESP.find(x=>x.id===k)||PM.MESTRE;
 const base=PM.MESTRE.steps;
 const steps=guia.steps&&guia.steps.length?guia.steps:base;
 const completed=steps.filter((_,i)=>getP(r,'_roteiroContextual.'+k+'.'+i)==='Sim').length;
 const pos=Object.fromEntries(PM.POS);
 return `<section class="qp-s qp-context"><h4><i>↳</i>Roteiro de análise integrado <em class="req${completed===steps.length?' ok':''}">${completed}/${steps.length}</em></h4>
 <div class="qp-context-intro"><b>${esc(guia.t)}</b><span class="tag">${esc(e.rot)}</span><p>${esc(guia.s||'Roteiro aplicado à espécie efetivamente em julgamento.')}</p><small>Classe cadastrada: ${esc(r.classe_judicial||'—')} · Espécie definida por ${esc(e.fonte)}. Alterar a espécie no cabeçalho atualiza o roteiro sem excluir as verificações anteriores.</small></div>
 <div class="qp-context-steps">${steps.map((step,i)=>{

function pmGuideSpec(e){const map={apel:'apc',ed:'ed',agint:'ain',ai:'ai',jr:'mono',rn:'rn'};const id=e.rnOnly?'rn':map[e.k];return id?PM.ESP.find(x=>x.id===id):null;}

const PM_OPERACIONAL=new Set(['Cada fato decisivo amarrado a documento (ID e folha)?']);
function pmIsOperacional(st){return PM_OPERACIONAL.has(st?.[1]);}
function pmIsAnaliseCaso(st){return PM_ANALISE_CASO.has(st?.[1]);}
/* Tudo o que não é questão concreta do caso nem dado operacional dos autos é conferência
   do texto/minuta segundo o Padrão Muta. */
function pmIsConformidade(st){return !!st && !pmIsAnaliseCaso(st) && !pmIsOperacional(st);}
function pmConformItems(r,e){
 const out=[];
 PM.MESTRE.steps.forEach((st,i)=>{if(pmIsConformidade(st))out.push({src:'mestre',i,st,title:'Padrão geral'});});
 const spec=pmGuideSpec(e);if(spec)spec.steps.forEach((st,i)=>{if(pmIsConformidade(st))out.push({src:spec.id,i,st,title:spec.t});});
 return out;
}
function conformBlock(r,e){const L=pmConformItems(r,e||espInfo(r));return `<div class="qp-pmblock" style="margin-top:4px"><header>Conferência de conformidade <small>minuta · Padrão Muta</small></header>${L.map(x=>{const key=`_conformidade.${x.src}.${x.i}`,v=S(getP(r,key)),st=x.st,tip=st[2]||'';return `<div class="qp-pmitem"><span class="qp-pmq" title="${esc(tip)}">${esc(st[1])}<i class="help" title="${esc(tip)}">?</i> <small class="tag">${esc(x.title)}</small></span><span class="qp-pma"><button type="button" class="yes${v==='Sim'?' on':''}" data-act="pmset" data-k="${esc(key)}" data-v="Sim">Sim</button><button type="button" class="no${v==='Não'?' on':''}" data-act="pmset" data-k="${esc(key)}" data-v="Não">Não</button></span>${v?`<span class="qp-pmresult"><b>${v}</b>${v==='Não'?' · ajuste de conformidade necessário':' · conforme ao padrão'}</span>`:''}</div>`;}).join('')}</div>`;}
function pmGuideItems(r,e,painel){
 const spec=pmGuideSpec(e), all=[];
 PM.MESTRE.steps.forEach((st,i)=>{if(pmIsAnaliseCaso(st)&&pmPanel(st[0])===painel)all.push({src:'mestre',i,st,title:'Questão geral do caso'});});
 if(spec)spec.steps.forEach((st,i)=>{if(pmIsAnaliseCaso(st)&&pmPanel(st[0])===painel)all.push({src:spec.id,i,st,title:spec.t});});
 const seen=new Set();return all.filter(x=>{const k=dNorm(x.st[1]);if(seen.has(k))return false;seen.add(k);return true;});
}
function pmGuideBlock(r,e,painel){
 if(!guideOn(r))return '';
 const L=pmGuideItems(r,e,painel);if(!L.length)return '';
 const pos=Object.fromEntries(PM.POS);
 return `<div class="qp-pmblock"><header>Análise jurídica complementar <small>informações e conclusões do processo · não revisão textual</small></header>${L.map(x=>{
   const key=`_pmGuide.${x.src}.${x.i}`,v=S(getP(r,key)),note=`_pmGuideNotas.${x.src}.${x.i}`;
   const st=x.st,tip=st[2]||'';
   return `<div class="qp-pmitem" data-pmkey="${esc(key)}"><span class="qp-pmq" title="${esc(tip)}">${esc(st[1])}<i class="help" title="${esc(tip)}">?</i> <small class="tag">${esc(pos[st[0]]||st[0])}</small></span><span class="qp-pma"><button type="button" class="yes${v==='Sim'?' on':''}" data-act="pmset" data-k="${esc(key)}" data-v="Sim">Sim</button><button type="button" class="no${v==='Não'?' on':''}" data-act="pmset" data-k="${esc(key)}" data-v="Não">Não</button></span>${v?`<span class="qp-pmresult"><b>${v}</b> · resposta registrada na análise do caso</span>`:''}<textarea class="qp-pmfield" data-k="${esc(note)}" placeholder="Registro do caso, fundamento, conclusão ou ID pertinente">${esc(getP(r,note)||'')}</textarea></div>`;
 }).join('')}</div>`;

function pmPending(r){const o=getP(r,'_pmGuide')||{},out=[];Object.entries(o).forEach(([src,vals])=>{if(!vals||typeof vals!=='object')return;Object.entries(vals).forEach(([i,v])=>{if(v!=='Não')return;const pool=src==='mestre'?PM.MESTRE:PM.ESP.find(x=>x.id===src);const st=pool&&pool.steps&&pool.steps[+i];if(st)out.push({rule:`pm:${src}:${i}`,section:pmPanel(st[0]),field:Object.fromEntries(PM.POS)[st[0]]||st[0],req:st[1],detail:st[2]||'Questão do roteiro ainda não satisfeita.'});});});return out;}

 if(/extensao do efeito devolutivo/.test(t))return review('Conferir se os limites do que foi devolvido pelo recurso estão delimitados no voto.');
 if(/sucumbencia recursal tratada/.test(t))return review('Conferir pressupostos legais e reflexos da sucumbência no dispositivo.');
 if(/pedidos residuais enfrentados/.test(t))return review('Confrontar os pedidos residuais cadastrados com o voto.');
 if(/dispositivo coerente|tipo de voto no pje/.test(t)){
   if(!present(vote))return review('Voto ainda sem redação suficiente.');
   if(!/ante o exposto/i.test(vote))return result('bad','Fórmula “Ante o exposto” não localizada no voto.');
   if(/tipo de voto no pje/.test(t))return review('Aferir a opção do PJe em comparação ao dispositivo produzido.');
   return result('ok','Fórmula de dispositivo identificada; coerência com o resultado exige revisão jurídica.');
 }
 if(/cada questao tem fecho|fecho proprio/.test(t))return review('Conferir se cada controvérsia possui conclusão própria e coerente.');
 if(/ementa na estrutura|ementa.*cnj/.test(t)){
   if(!present(em))return review('Ementa ainda não preenchida.','em');
   const missing=['I.','II.','III.','IV.'].filter(p=>!em.includes(p));
   if(missing.length)return result('bad','Seções estruturais ausentes: '+missing.join(', ')+'.','em');
   return result('ok','Quatro seções estruturais localizadas; conteúdo exige leitura final.','em');
 }
 if(/ementa limpa e fiel/.test(t)){
   if(!present(em))return review('Ementa sem conteúdo para conferência.','em');
   if(/\bID\s*\d{5,}\b/i.test(em))return result('bad','Foi localizada referência a ID no corpo da ementa.','em');
   return review('Conferir fidelidade da ementa ao voto, nomes, linguagem e jurisprudência.','em');
 }
 if(/acordao espelha|ac[oó]rd[aã]o espelha/.test(t))return review('Comparar resultado e votação da proclamação com o dispositivo efetivo.','proc');
 if(/revisao de forma concluida/.test(t)){
   if(/\b(naesp[eé]cie|embargosde|ID's)\b/i.test(doc.source))return result('bad','Possível erro de aglutinação ou forma (“Naespécie”, “embargosde”, “ID’s”).');
   return review('Verificar grafia, pontuação, concordância, aglutinações e numeração.');
 }
 if(/precedente de ratificacao depois|jurisprudencia.*depois/.test(t))return review('A posição do precedente exige leitura da ordem argumentativa do voto.');
 if(/fatos introduzidos por/.test(t))return review('Verificar uso contextual da locução e vinculação documental sem reproduzir texto genérico.');
 if(/fundamento decisivo/.test(t))return review('Conferir citação do fundamento determinante e sua relação com o recurso.');
 if(/ponto|cita|norma|contrad|omiss|artigo/.test(t)&&!present(vote))return review('Voto ainda sem texto suficiente para esta verificação.');
 return review('Verificação sem critério automático seguro: exige leitura da minuta.');
}

function vfCatalogEntries(payload,type){
  const arr=Array.isArray(payload)?payload:
    (payload&&Array.isArray(payload.registros)?payload.registros:
    (type==='modelos'&&Array.isArray(payload?.modelos)?payload.modelos:
    (type==='trechos'&&Array.isArray(payload?.paragrafos)?payload.paragrafos:
    (type==='trechos'&&Array.isArray(payload?.trechos)?payload.trechos:null))));
  if(!arr)throw Error('Formato inesperado: esperado um array ou registros/modelos/paragrafos.');
  const ids=new Set(),out=[];
  for(const raw of arr){
    if(!raw || typeof raw!=='object' || raw.id===null || raw.id===undefined || !String(raw.id).trim())continue;
    const id=String(raw.id);if(ids.has(id))continue;ids.add(id);
    out.push({...raw,id});
  }
  return out;
}
function vfCatalogText(raw){
  const field=['texto','txt','conteudo','corpo','minuta','voto','texto_modelo','textoModelo','text','modelo'];
  function val(x){
    if(typeof x==='string')return x;
    if(Array.isArray(x))return x.map(val).filter(Boolean).join('\n\n');
    if(x&&typeof x==='object'){
      if(typeof x.texto==='string')return x.texto;
      if(typeof x.txt==='string')return x.txt;
      if(typeof x.conteudo==='string')return x.conteudo;
      if(typeof x.text==='string')return x.text;
    }
    return '';
  }
  for(const key of field){if(Object.prototype.hasOwnProperty.call(raw,key)){const x=val(raw[key]);if(x.trim())return x;}}
  for(const key of ['blocos','secoes','partes','paragrafos']){
    if(Array.isArray(raw[key])){const x=val(raw[key]);if(x.trim())return x;}
  }
  return '';
}
function vfCatalogTitle(raw){return S(raw.titulo||raw.nome||raw.title||raw.identificacao||raw.assunto||raw.id);}
function vfCatalogMetadata(raw){return [raw.assunto,raw.subassunto,raw.tema,raw.temas,raw.classe,raw.especie,raw.etiquetas,raw.especificidades,raw.resultado,raw.tipo,raw.categoria,raw.nivelCategoria,raw.nivelTema,raw.nivelEspecificidade,raw.nivelSubsecao].flatMap(x=>Array.isArray(x)?x:[x]).filter(Boolean).map(String).join(' ');}
function vfRank(r,raw){

 return current.reduce((sum,key)=>sum+(key.length>2&&meta.includes(key)?1:0),0);
}
async function vfGitLoad(type,force=false){

 bank.status='loading';bank.error='';bank.items=[];bank.started=true;
 if(ST.ger&&R(ST.ger))paintGer();
 try{
   const resp=await fetch(/^https?:/.test(VF_GIT_PATH[type])?VF_GIT_PATH[type]:VF_GIT_ROOT+VF_GIT_PATH[type],{cache:'no-store',headers:{Accept:'application/json'},signal:typeof AbortSignal!=='undefined'&&AbortSignal.timeout?AbortSignal.timeout(8500):undefined});
   if(!resp.ok)throw Error('HTTP '+resp.status);
   const json=await resp.json();const items=vfCatalogEntries(json,type);
   bank.items=items;bank.status='ready';bank.error='';
 }catch(err){
   bank.items=[];bank.status='error';bank.error=String(err?.message||err);
 }
 if(ST.ger&&R(ST.ger))paintGer();
}

/* calculadora de tempestividade (dias úteis; sem feriados da JF nesta prévia) */
function addUteis(iso,n){const d=new Date(iso+'T12:00:00');let c=0;while(c<n){d.setDate(d.getDate()+1);const w=d.getDay();if(w&&w<6)c++;}return d.toISOString().slice(0,10);}
function dobroDe(r){const p=norm((r._recursos||[])[0]?.parte||'');return yes(r['DPU (controle)'])||ENTE.test(p)||/ministerio publico/.test(p);}

/* ═════════ Padrão: texto do relatório a partir do card ═════════ */
function padrao(r){
  const e=espInfo(r),c0=(r._recursos||[])[0]||{},rec=parteDe(c0)?art(parteDe(c0)):'por [recorrente]',idr=S(c0.ids)?` (ID ${c0.ids})`:'';
  const outros=(r._recursos||[]).slice(1).map(c=>`${parteDe(c)?art(parteDe(c)):'por [recorrente]'}${S(c.ids)?` (ID ${c.ids})`:''}`);
  const sid=S(r['Sentença - ID'])?` (ID ${r['Sentença - ID']})`:'',iid=S(r['Impugnada - ID'])?` (ID ${r['Impugnada - ID']})`:'',idt=S(r['Impugnada - Data'])?`, de ${br(r['Impugnada - Data'])}`:'';
  const juizo=S(r['Origem - Juízo'])||'[juízo de origem]',dec=S(r['Sentença - Decisão'])?S(r['Sentença - Decisão']).toLowerCase():'[resultado]';
  const pa=S(r['Polo Ativo'])||'[polo ativo]',pp=S(r['Polo Passivo'])||'[polo passivo]';
  let t;
  if(e.k==='ed')t=`Trata-se de embargos de declaração opostos ${rec}${idr} ao acórdão${iid}${idt}, proferido pela ${S(r['Impugnada - Órgão'])||'[órgão julgador]'}.\n\nAlega a parte embargante ${S(r['ED - Vício'])||'[vício]'}${S(r['ED - Ponto'])?` quanto a ${S(r['ED - Ponto']).replace(/\.$/,'')}`:''}.`;
  else if(e.k==='agint')t=`Trata-se de agravo interno interposto ${rec}${idr} contra a decisão monocrática${iid}${idt} que ${S(r['Impugnada - Síntese'])||'[o que decidiu]'}.\n\nSustenta a parte agravante ${S(r['AgInt - Fundamentos'])||'[fundamentos]'}.`;
  else if(e.k==='ai')t=`Trata-se de agravo de instrumento interposto ${rec}${idr} contra a decisão${iid}${idt}, proferida pelo ${juizo}.`;
  else if(e.k==='jr')t=`Os autos retornaram da ${S(r['Retratação - Devolução órgão'])||'Vice-Presidência'}${S(r['Retratação - Devolução ID'])?` (ID ${r['Retratação - Devolução ID']})`:''} para eventual juízo de retratação (art. 1.040, II, do CPC), em face do julgamento do Tema ${S(r['Retratação - Tema'])||'[n]'} pelo ${S(r['Retratação - Tribunal'])||'STF'}${S(r['Retratação - Precedente'])?` (${r['Retratação - Precedente']})`:''}.`;
  else if(e.rnOnly)t=`Trata-se de remessa necessária da sentença${sid} proferida pelo ${juizo} que julgou ${dec} o pedido, nos autos da ação ajuizada por ${pa} em face de ${pp}.`;
  else t=`Trata-se de ${outros.length?`apelações interpostas ${rec}${idr} e ${outros.join(' e ')}`:`apelação interposta ${rec}${idr}`} contra a sentença${sid} proferida pelo ${juizo} que julgou ${dec} o pedido, nos autos da ação ajuizada por ${pa} em face de ${pp}.${e.rn?'\n\nA sentença está sujeita ao reexame necessário (art. 496 do CPC).':''}`;

  const turma=txt.match(/(\d)ª\s*Turma/);if(turma&&kind==='ed')add('Impugnada - Órgão','Órgão julgador',`${turma[1]}ª Turma`,'');
  const rec=/opostos? pel[ao] uniao|interpost[ao] pel[ao] uniao/.test(n)?'União':/pel[ao] inss/.test(n)?'INSS':/pela parte autora/.test(n)?'parte autora':/pela parte re\b/.test(n)?'parte ré':'';

  return sug;

}
